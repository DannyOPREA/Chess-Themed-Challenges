name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skips the remaining steps until the app has been scaffolded.
      - id: app
        run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.app.outputs.exists == 'true'
        run: npm ci

      - if: steps.app.outputs.exists == 'true'
        run: npm run typecheck

      - if: steps.app.outputs.exists == 'true'
        run: npm test
